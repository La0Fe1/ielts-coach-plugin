services:
  - type: web
    name: ielts-coach
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ACCESS_CODE
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      # v2.2.0：MCP 远程接入（务必设置，AI 工具用 Authorization: Bearer <MCP_TOKEN>）
      - key: MCP_TOKEN
        sync: false
      # 公网部署建议开启多用户隔离，朋友的数据只留在各自浏览器
      - key: MULTI_USER_MODE
        value: "true"
      # 免费实例的 /data 随实例重建而清空；要长期保存课程请升级并挂 Disk 到这里
      - key: IELTS_COACH_DATA_DIR
        value: /data
      # create_lesson 返回给用户点开的网页地址前缀，部署后填 https://<你的服务>.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOW_PUBLIC_HOST_KEY
        value: "false"
