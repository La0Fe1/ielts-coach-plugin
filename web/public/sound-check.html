<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>IELTS 口语教练 · 声音自检</title>
    <style>
      :root { color-scheme: light; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f4f0; color: #262421; margin: 0; padding: 24px 16px 60px; }
      .wrap { max-width: 760px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 6px; }
      p.lead { color: #6b665e; margin: 0 0 18px; font-size: 14px; line-height: 1.6; }
      .card { background: #fff; border: 1px solid #e4e0d8; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
      button { font: inherit; font-size: 14px; padding: 10px 16px; border-radius: 10px; border: 1px solid #d9d3c8;
        background: #fff; cursor: pointer; }
      button.primary { background: #2f6f55; border-color: #2f6f55; color: #fff; }
      button:disabled { opacity: .55; cursor: not-allowed; }
      #log { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; line-height: 1.7;
        white-space: pre-wrap; word-break: break-word; background: #fbfaf7; border: 1px solid #eee9df;
        border-radius: 10px; padding: 12px; min-height: 160px; max-height: 60vh; overflow: auto; }
      .ok { color: #1d7a4c; font-weight: 600; }
      .bad { color: #b3261e; font-weight: 600; }
      .hint { font-size: 12.5px; color: #6b665e; line-height: 1.7; margin-top: 10px; }
      a { color: #2f6f55; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>🔊 声音自检</h1>
      <p class="lead">
        这一页只做一件事：告诉你「浏览器 / 服务端朗读到底哪一步没出声」。请依次点下面三个按钮，
        然后把日志区内容（或者截图）发给我。页面会显示服务端版本，顺便确认你有没有打开到新版。
      </p>

      <div class="card">
        <div class="row">
          <button id="env" class="primary">① 检查环境</button>
          <button id="play" class="primary">② 播放测试音（Edge 朗读）</button>
          <button id="sys">③ 测试浏览器朗读（兜底）</button>
        </div>
        <div id="log">等待开始…</div>
        <p class="hint">
          判断方法：<br />
          · ② 显示 <span class="ok">✅ 已播放</span> 但你听不到 → 是系统音量 / 标签页静音 / 输出设备的问题（不是网页问题）。<br />
          · ② 显示 <span class="bad">❌</span> → 服务端朗读被限流或网络问题，日志里会有状态码。<br />
          · ③ 是浏览器自带朗读，用来判断系统扬声器是否正常。
        </p>
      </div>

      <p class="hint">返回练口语：<a href="/">http://127.0.0.1:3000/</a></p>
    </div>

    <script>
      const logEl = document.getElementById('log');
      const lines = [];
      function log(message, cls) {
        const stamp = new Date().toISOString().slice(11, 23);
        lines.push('[' + stamp + '] ' + message);
        logEl.innerHTML = lines
          .map((line) => {
            const escaped = line.replace(/&/g, '&amp;').replace(/</g, '&lt;');
            return escaped.replace(/(✅[^\n]*)/g, '<span class="ok">$1</span>').replace(/(❌[^\n]*)/g, '<span class="bad">$1</span>');
          })
          .join('\n');
        logEl.scrollTop = logEl.scrollHeight;
      }
      function setBusy(busy) {
        for (const id of ['env', 'play', 'sys']) document.getElementById(id).disabled = busy;
      }
      window.addEventListener('error', (event) => log('❌ 页面 JS 错误：' + (event.message || event.error), 'bad'));
      window.addEventListener('unhandledrejection', (event) => log('❌ 未处理的 Promise 错误：' + String(event.reason), 'bad'));

      async function loadStatus() {
        const started = performance.now();
        const response = await fetch('/api/status');
        const data = await response.json();
        log('服务端 /api/status：version=' + data.version + ' tts=' + JSON.stringify(data.tts || {}) +
          '（' + Math.round(performance.now() - started) + 'ms）');
        return data;
      }

      document.getElementById('env').addEventListener('click', async () => {
        setBusy(true);
        try {
          log('──────── ① 环境检查 ────────');
          log('URL：' + location.href);
          log('User-Agent：' + navigator.userAgent);
          log('secureContext=' + window.isSecureContext + ' | origin=' + location.origin);
          const Context = window.AudioContext || window.webkitAudioContext;
          log('AudioContext 支持：' + (Context ? '是' : '否（❌ 没有 Web Audio）'));
          if (Context) {
            const ctx = new Context();
            log('AudioContext 初始状态：' + ctx.state + ' | sampleRate=' + ctx.sampleRate +
              ' | maxChannels=' + ctx.destination.maxChannelCount);
            try { await ctx.resume(); } catch (error) { log('❌ ctx.resume 失败：' + error, 'bad'); }
            log('AudioContext resume 后：' + ctx.state);
            await ctx.close();
          }
          log('speechSynthesis：' + (window.speechSynthesis ? '有' : '无'));
          if (window.speechSynthesis) {
            const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
            log('系统朗读 voices 数量：' + voices.length + (voices.length ? '（' + voices.slice(0, 3).map((v) => v.name + '/' + v.lang).join('，') + '）' : ''));
          }
          const bundle = Array.from(document.scripts).map((s) => s.src).filter(Boolean);
          log('本页脚本：' + (bundle.join(', ') || '(无)'));
          await loadStatus();
          log('✅ 环境检查完成');
        } catch (error) {
          log('❌ 环境检查失败：' + error, 'bad');
        } finally {
          setBusy(false);
        }
      });

      document.getElementById('play').addEventListener('click', async () => {
        setBusy(true);
        try {
          log('──────── ② 真实 Edge 朗读播放 ────────');
          const Context = window.AudioContext || window.webkitAudioContext;
          if (!Context) { log('❌ 浏览器没有 AudioContext，无法播放', 'bad'); return; }
          const ctx = new Context();
          log('创建 AudioContext：' + ctx.state);
          await ctx.resume();
          log('resume 后：' + ctx.state);
          const started = performance.now();
          const response = await fetch('/api/voice/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: 'Hello, this is a sound check of the examiner voice. If you can hear this sentence, audio playback works.', accent: 'uk' }),
          });
          log('POST /api/voice/tts → HTTP ' + response.status + ' | ' + (response.headers.get('content-type') || '') +
            ' | ' + Math.round(performance.now() - started) + 'ms');
          if (!response.ok) {
            const body = await response.text().catch(() => '');
            log('❌ 服务端朗读失败（HTTP ' + response.status + '）：' + body.slice(0, 200), 'bad');
            await loadStatus();
            return;
          }
          const bytes = await response.arrayBuffer();
          log('收到音频字节数：' + bytes.byteLength);
          const decoded = await ctx.decodeAudioData(bytes);
          log('decodeAudioData 成功：时长 ' + decoded.duration.toFixed(2) + 's | sampleRate=' + decoded.sampleRate +
            ' | channels=' + decoded.numberOfChannels);
          let peak = 0;
          const channel = decoded.getChannelData(0);
          for (let i = 0; i < channel.length; i += 50) peak = Math.max(peak, Math.abs(channel[i]));
          log('音量峰值：' + peak.toFixed(3) + (peak < 0.01 ? '（❌ 音频几乎无声）' : ''));
          const source = ctx.createBufferSource();
          source.buffer = decoded;
          source.connect(ctx.destination);
          const outcome = await new Promise((resolve) => {
            let settled = false;
            const finish = (value) => { if (!settled) { settled = true; resolve(value); } };
            source.onended = () => finish('ended');
            setTimeout(() => finish('timeout'), decoded.duration * 1000 + 3000);
            try { source.start(); } catch (error) { finish('start-error: ' + error.message); }
          });
          log('播放结果：' + outcome + ' | AudioContext 状态：' + ctx.state +
            (outcome === 'ended' ? ' → ✅ 已播放（如果你仍听不到，是系统音量/输出设备/标签页静音的问题）' : ' → ❌ 播放异常'));
          await loadStatus();
          await ctx.close();
        } catch (error) {
          log('❌ 播放测试异常：' + error, 'bad');
        } finally {
          setBusy(false);
        }
      });

      document.getElementById('sys').addEventListener('click', async () => {
        setBusy(true);
        try {
          log('──────── ③ 浏览器自带朗读（兜底通道） ────────');
          const synth = window.speechSynthesis;
          const Utterance = window.SpeechSynthesisUtterance;
          if (!synth || typeof Utterance !== 'function') { log('❌ 浏览器不支持 speechSynthesis', 'bad'); return; }
          const voices = synth.getVoices ? synth.getVoices() : [];
          log('voices 数量：' + voices.length);
          await new Promise((resolve) => {
            let settled = false;
            const finish = (value) => { if (!settled) { settled = true; resolve(value); log('浏览器朗读结果：' + value); } };
            const utterance = new Utterance('Hello, this is the browser speech fallback. One, two, three.');
            utterance.lang = 'en-GB';
            utterance.rate = 0.98;
            const match = voices.find((voice) => (voice.lang || '').toLowerCase().startsWith('en'));
            if (match) utterance.voice = match;
            utterance.onend = () => finish('ended ✅');
            utterance.onerror = (event) => finish('error ❌ ' + (event.error || ''));
            synth.cancel();
            synth.resume?.();
            synth.speak(utterance);
            setTimeout(() => finish('timeout（3 秒内没有 end 事件）'), 6000);
          });
          log('✅ 浏览器朗读测试完成（若 ✅ 但你听不到，系统扬声器/音量有问题）');
        } catch (error) {
          log('❌ 浏览器朗读测试异常：' + error, 'bad');
        } finally {
          setBusy(false);
        }
      });

      log('页面已加载。先点「① 检查环境」→「② 播放测试音」→「③ 浏览器朗读」。');
    </script>
  </body>
</html>
